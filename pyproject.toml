[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charlestle-pairsig"
version = "0.1.0"
description = "用配对检验判断差异方向与显著性，标出差异不显著的题目"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "charlestle" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://charlestle.github.io"
Repository = "https://github.com/charlestle/pairsig"
Issues = "https://github.com/charlestle/pairsig/issues"

[project.scripts]
pairsig = "pairsig:main"

[tool.setuptools]
py-modules = ["pairsig"]
